<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Get Goen</title>
  <meta name="description" content="Thank you for getting in touch with Get Goen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
  <style>
    .thanks-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .thanks-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 140px var(--page-pad) 100px;
    }

    .thanks-panel {
      width: min(100%, 880px);
      padding: clamp(32px, 6vw, 72px);
      border: 0.5px solid var(--dust);
      background:
        linear-gradient(180deg, rgba(20, 18, 16, 0.92) 0%, rgba(10, 9, 8, 0.98) 100%);
      position: relative;
      overflow: hidden;
    }

    .thanks-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(196, 36, 36, 0.16), transparent 34%),
        linear-gradient(to bottom, transparent 0%, rgba(196, 36, 36, 0.03) 100%);
      pointer-events: none;
    }

    .thanks-inner {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .thanks-kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--red-hi);
    }

    .thanks-kicker::before {
      content: "";
      width: 34px;
      height: 0.5px;
      background: var(--red);
      flex-shrink: 0;
    }

    .thanks-title {
      font-family: var(--font-serif);
      font-size: clamp(44px, 10vw, 120px);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: var(--tracking-display);
      color: var(--paper);
    }

    .thanks-title em {
      font-style: normal;
      color: var(--red-hi);
      opacity: 0.9;
    }

    .thanks-copy {
      margin-top: 30px;
      display: grid;
      gap: 14px;
      max-width: 42ch;
    }

    .thanks-copy p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--mist);
    }

    .thanks-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 36px;
      align-items: center;
    }

    .thanks-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--paper);
      transition: color 0.3s ease;
    }

    .thanks-link:hover,
    .thanks-link:focus-visible {
      color: var(--red-hi);
    }

    .thanks-link--secondary {
      color: var(--fog);
    }

    @media (max-width: 600px) {
      .thanks-main {
        padding-top: 110px;
        padding-bottom: 72px;
      }

      .thanks-panel {
        padding: 28px 22px 34px;
      }

      .thanks-actions {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="thanks-shell">
    <header>
      <nav aria-label="Main navigation">
        <a href="/" class="nav-brand" aria-label="Get Goen - home">
          <img
            src="assets/images/goenLogo.svg"
            alt="Get Goen"
            class="nav-logo-img"
            width="48"
            height="48"
          >
          <img
            src="assets/images/goen-logo-text.webp"
            alt=""
            class="nav-wordmark-img"
            width="642"
            height="370"
          >
        </a>
      </nav>
    </header>

    <main class="thanks-main">
      <section class="thanks-panel" aria-labelledby="thanks-heading">
        <div class="thanks-inner">
          <span class="thanks-kicker">Message Received</span>
          <h1 id="thanks-heading" class="thanks-title">
            Thank<br>
            <em>You</em>
          </h1>

          <div class="thanks-copy">
            <p>Your message is on its way. We appreciate you reaching out.</p>
            <p>If the project feels like the right fit, we’ll be in touch soon.</p>
          </div>

          <div class="thanks-actions">
            <a href="index.html" class="thanks-link">← Back to home</a>
            <a href="https://instagram.com/getgoen" target="_blank" rel="noopener" class="thanks-link thanks-link--secondary">Instagram →</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>
        <small>© <span id="year"></span> Get Goen — Osaka, Japan</small>
      </p>
      <span class="footer-goen" aria-label="Get Goen">
        get <span>goen</span> · 縁
      </span>
    </footer>
  </div>

  <script>
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
</body>
</html>
